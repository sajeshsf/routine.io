build:
  maxIssues: 0
  weights:
    complexity: 2
    LongParameterList: 1
    style: 1

config:
  validation: true

processors:
  active: true
  exclude:
    - "DetektProgressListener"

style:
  MagicNumber:
    active: false

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - "Composable"

complexity:
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 8
    ignoreDefaultParameters: true

exceptions:
  TooGenericExceptionCaught:
    active: true
