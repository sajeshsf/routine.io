name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Lint (Dev)
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: ./gradlew ktlintCheck lintDevDebug

      - name: Lint (Release)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew ktlintCheck lintProdRelease

      - name: Unit tests (Dev)
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: ./gradlew testDevDebugUnitTest

      - name: Unit tests (Release)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew testProdReleaseUnitTest

      - name: Build Dev APK
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: ./gradlew assembleDevDebug

      - name: Build Release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew assembleProdRelease

      - name: Dependency scan
        run: ./gradlew dependencyCheckAnalyze

      - name: Upload Dev APK
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: project-garage-dev-apk
          path: app/build/outputs/apk/dev/debug/app-dev-debug.apk

      - name: Upload Release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: project-garage-release-apk
          path: app/build/outputs/apk/prod/release/app-prod-release.apk
